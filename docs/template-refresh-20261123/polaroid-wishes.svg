)" opacity="1"><g><rect y="0" width="294" height="56" rx="16" fill="#77604A"/><text x="147" y="34" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">Gửi một lời hồi đáp</text></g></g></svg>
