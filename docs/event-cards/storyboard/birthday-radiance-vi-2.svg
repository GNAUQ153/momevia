<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-label="Bản xem trước mẫu quà Momevia"><rect width="100%" height="100%" fill="#FFF5DC"/><g transform="translate(27 46)" opacity="1"><g><rect width="336" height="13" rx="3" fill="#41BCAF" stroke="#6136DF" stroke-width="0"/></g></g><g transform="translate(42 88)" opacity="1"><g><text x="153" y="30" fill="#362644" font-family="Arial,sans-serif" font-size="30" font-weight="700" text-anchor="middle"><tspan x="153" dy="0">Tuổi mới, thêm</tspan><tspan x="153" dy="37.5">ngày vui.</tspan></text></g></g><g transform="translate(42 192)" opacity="1"><g><text x="153" y="22" fill="#362644" font-family="Arial,sans-serif" font-size="22" font-weight="400" text-anchor="middle"><tspan x="153" dy="0">Nguyễn Hoàng Minh Anh</tspan></text></g></g><g transform="translate(42 290)" opacity="1"><g><text x="0" y="21" fill="#362644" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start"><tspan x="0" dy="0">Tuổi mới, mong bạn có thật</tspan><tspan x="0" dy="32.550000000000004">nhiều ngày vui như hôm</tspan><tspan x="0" dy="32.550000000000004">nay.</tspan><tspan x="0" dy="32.550000000000004"></tspan><tspan x="0" dy="32.550000000000004">Có những người bạn thật</tspan><tspan x="0" dy="32.550000000000004">gần, những chuyến đi ngẫu</tspan><tspan x="0" dy="32.550000000000004">hứng và đủ can đảm thử</tspan><tspan x="0" dy="32.550000000000004">điều mình thích. Mừng sinh</tspan><tspan x="0" dy="32.550000000000004">nhật bạn!</tspan></text></g></g><g transform="translate(42 572)" opacity="1"><g><text x="306" y="16" fill="#362644" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="end"><tspan x="306" dy="0">Cùng bạn đón tuổi mới,</tspan></text></g></g><g transform="translate(42 610)" opacity="1"><g><text x="306" y="21" fill="#362644" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="end"><tspan x="306" dy="0">Một người luôn nhớ bạn</tspan></text></g></g><g transform="translate(60 737)" opacity="1"><g><rect width="270" height="72" rx="16" fill="#68374B"/><text x="135" y="42" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">Một lời đáp cho bạn</text></g></g><g><rect x="42" y="88" width="306" height="83" rx="2" fill="none" stroke="#BD3370" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="42" cy="88" r="9" fill="#BD3370"/><text x="42" y="92" text-anchor="middle" font-family="Arial" font-size="11" fill="white">1</text><rect x="42" y="192" width="306" height="70" rx="2" fill="none" stroke="#BD3370" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="42" cy="192" r="9" fill="#BD3370"/><text x="42" y="196" text-anchor="middle" font-family="Arial" font-size="11" fill="white">2</text><rect x="42" y="290" width="306" height="252" rx="2" fill="none" stroke="#BD3370" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="42" cy="290" r="9" fill="#BD3370"/><text x="42" y="294" text-anchor="middle" font-family="Arial" font-size="11" fill="white">3</text><rect x="42" y="572" width="306" height="30" rx="2" fill="none" stroke="#BD3370" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="42" cy="572" r="9" fill="#BD3370"/><text x="42" y="576" text-anchor="middle" font-family="Arial" font-size="11" fill="white">4</text><rect x="42" y="610" width="306" height="65" rx="2" fill="none" stroke="#BD3370" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="42" cy="610" r="9" fill="#BD3370"/><text x="42" y="614" text-anchor="middle" font-family="Arial" font-size="11" fill="white">5</text><rect x="60" y="737" width="270" height="72" rx="2" fill="none" stroke="#BD3370" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="60" cy="737" r="9" fill="#BD3370"/><text x="60" y="741" text-anchor="middle" font-family="Arial" font-size="11" fill="white">6</text></g></svg>
