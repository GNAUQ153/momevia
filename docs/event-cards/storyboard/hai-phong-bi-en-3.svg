<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-label="Bản xem trước mẫu quà Momevia"><rect width="100%" height="100%" fill="#FFF8EB"/><g transform="translate(42 55)" opacity="1"><g><text x="153" y="34" fill="#442638" font-family="Georgia,serif" font-size="34" font-weight="700" text-anchor="middle"><tspan x="153" dy="0">A wedding wish</tspan></text></g></g><g transform="translate(42 162)" opacity="1"><g><text x="0" y="21" fill="#442638" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start"><tspan x="0" dy="0">May you tell the story of</tspan><tspan x="0" dy="32.550000000000004">today for years to come.</tspan><tspan x="0" dy="32.550000000000004"></tspan><tspan x="0" dy="32.550000000000004">Keep laughing at the</tspan><tspan x="0" dy="32.550000000000004">little things, face the</tspan><tspan x="0" dy="32.550000000000004">hard days together, and</tspan><tspan x="0" dy="32.550000000000004">always give each other a</tspan><tspan x="0" dy="32.550000000000004">place to come home to.</tspan><tspan x="0" dy="32.550000000000004">Here’s to you both!</tspan></text></g></g><g transform="translate(42 378)" opacity="1"><g><text x="306" y="16" fill="#442638" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="end"><tspan x="306" dy="0">With love to you both,</tspan></text></g></g><g transform="translate(42 416)" opacity="1"><g><text x="306" y="21" fill="#442638" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="end"><tspan x="306" dy="0">Someone thinking of you</tspan></text></g></g><g transform="translate(62 512)" opacity="1"><g><rect width="266" height="72" rx="16" fill="#963851"/><text x="133" y="42" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">Back to both envelopes</text></g></g><g transform="translate(24 602)" opacity="1"><g><rect width="342" height="208" rx="20" fill="#FFFFFF"/><text x="18" y="35" fill="#32243B" font-size="20" font-family="Arial,sans-serif">A note from you two</text><rect x="18" y="70" width="306" height="42" rx="8" fill="#F7F4FA"/><rect x="18" y="130" width="306" height="88" rx="8" fill="#F7F4FA"/></g></g><g><rect x="42" y="55" width="306" height="75" rx="2" fill="none" stroke="#BD3370" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="42" cy="55" r="9" fill="#BD3370"/><text x="42" y="59" text-anchor="middle" font-family="Arial" font-size="11" fill="white">1</text><rect x="42" y="162" width="306" height="194" rx="2" fill="none" stroke="#BD3370" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="42" cy="162" r="9" fill="#BD3370"/><text x="42" y="166" text-anchor="middle" font-family="Arial" font-size="11" fill="white">2</text><rect x="42" y="378" width="306" height="30" rx="2" fill="none" stroke="#BD3370" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="42" cy="378" r="9" fill="#BD3370"/><text x="42" y="382" text-anchor="middle" font-family="Arial" font-size="11" fill="white">3</text><rect x="42" y="416" width="306" height="65" rx="2" fill="none" stroke="#BD3370" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="42" cy="416" r="9" fill="#BD3370"/><text x="42" y="420" text-anchor="middle" font-family="Arial" font-size="11" fill="white">4</text><rect x="62" y="512" width="266" height="72" rx="2" fill="none" stroke="#BD3370" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="62" cy="512" r="9" fill="#BD3370"/><text x="62" y="516" text-anchor="middle" font-family="Arial" font-size="11" fill="white">5</text><rect x="24" y="602" width="342" height="208" rx="2" fill="none" stroke="#BD3370" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="24" cy="602" r="9" fill="#BD3370"/><text x="24" y="606" text-anchor="middle" font-family="Arial" font-size="11" fill="white">6</text></g></svg>
